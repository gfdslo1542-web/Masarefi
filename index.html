<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مصاريفي</title>
<meta name="theme-color" content="#075e54">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#ece5dd;--card:#fff;--text:#111b21;--muted:#5b6b73;--border:#e2e7e9;--accent:#25d366;--accent-d:#0f7a6c;--header:#075e54;--danger:#c9302c;--warn:#b37400;--ok:#14803f;--input:#f4f4f1;--soft:#e3f5d3;--btn-text:#fff;--shadow:rgba(0,0,0,.25)}
[data-theme=dark]{--bg:#0b141a;--card:#16222a;--text:#e7eef1;--muted:#9fb0b8;--border:#26363f;--accent:#2fd47a;--accent-d:#1d9e8c;--header:#12302c;--danger:#ff7a73;--warn:#f0b429;--ok:#4cd98a;--input:#1d2c35;--soft:#1c3a2d;--btn-text:#04170f;--shadow:rgba(0,0,0,.6)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){--bg:#0b141a;--card:#16222a;--text:#e7eef1;--muted:#9fb0b8;--border:#26363f;--accent:#2fd47a;--accent-d:#1d9e8c;--header:#12302c;--danger:#ff7a73;--warn:#f0b429;--ok:#4cd98a;--input:#1d2c35;--soft:#1c3a2d;--btn-text:#04170f;--shadow:rgba(0,0,0,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;padding-bottom:calc(150px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;width:100%;min-height:46px;border:1px solid var(--border);border-radius:12px;padding:8px 12px;background:var(--input);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent-d);outline-offset:1px}
label.fl{display:block;font-size:13px;color:var(--muted);margin:12px 2px 5px}
header.top{background:var(--header);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:20}
header.top h1{margin:0;font-size:19px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.mnav button{color:#fff;font-size:20px;width:44px;height:40px;border-radius:10px}
.mnav .cur{flex:1;max-width:220px;height:40px;background:rgba(255,255,255,.14);border-radius:10px;font-weight:700;font-size:15px}
#app{max-width:640px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted)}.small{font-size:13px}
.big{font-size:30px;font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.box{background:var(--input);border-radius:12px;padding:10px 6px;text-align:center}
.box .l{font-size:12px;color:var(--muted)}.box .v{font-size:16px;font-weight:700;word-break:break-word}
.pos{color:var(--ok)}.neg{color:var(--danger)}.warnc{color:var(--warn)}
.btn{display:block;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--border);background:var(--input);font-weight:700;text-align:center;padding:8px 12px}
.btn.p{background:var(--accent-d);color:#fff;border-color:var(--accent-d)}
.btn.d{color:var(--danger)}
.btn.sm{min-height:40px;width:auto;display:inline-block;font-size:14px;padding:6px 14px}
.btn[disabled]{opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bar{height:12px;background:var(--input);border-radius:8px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--accent-d);border-radius:8px}
.bar.warn i{background:var(--warn)}.bar.danger i{background:var(--danger)}
.status{font-size:14px;font-weight:700;margin-top:4px}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.danger{color:var(--danger)}
.entry{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.entry:last-child{border-bottom:0}
.entry .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--input);flex:none}
.entry .mid{flex:1;min-width:0}
.entry .t{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.entry .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.entry .a{font-weight:700;font-size:14.5px;white-space:nowrap}
.entry .ab{width:40px;height:40px;border-radius:10px;font-size:16px;color:var(--muted);flex:none}
.entry .ab.x{color:var(--danger)}
details.day{border-bottom:1px solid var(--border)}
details.day:last-child{border-bottom:0}
details.day>summary{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:46px;cursor:pointer;font-weight:600;list-style:none}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary::after{content:"▾";color:var(--muted);margin-inline-start:6px}
.empty{text-align:center;color:var(--muted);padding:18px 6px;font-size:14px}
.empty .e{font-size:34px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:42px;padding:6px 14px;border-radius:21px;border:1px solid var(--border);background:var(--input);font-size:14px}
.chip[aria-pressed=true],.chip.on{background:var(--accent-d);color:#fff;border-color:var(--accent-d)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{min-height:66px;border-radius:14px;border:2px solid var(--border);background:var(--input);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;padding:4px;overflow-wrap:anywhere}
.cat .ci{font-size:22px}
.cat[aria-pressed=true]{border-color:var(--accent-d);background:var(--soft);font-weight:700}
.cat .tg{font-size:10.5px;color:var(--muted)}
nav#nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:25}
nav#nav button{flex:1;padding:7px 2px 6px;font-size:11.5px;color:var(--muted);text-align:center;min-height:56px}
nav#nav button .i{display:block;font-size:20px;line-height:1.2}
nav#nav button[aria-current=page]{color:var(--accent-d);font-weight:800}
#fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));inset-inline-end:16px;width:60px;height:60px;border-radius:30px;background:var(--accent-d);color:#fff;font-size:32px;line-height:1;box-shadow:0 4px 14px var(--shadow);z-index:26}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.ov.mid{align-items:center;padding:20px}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom))}
.ov.mid .sheet{border-radius:16px;max-width:360px;max-height:85vh}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheet .hd b{font-size:17px}
.sheet .hd button{font-size:22px;width:44px;height:44px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--input);border-radius:12px;padding:4px;margin:8px 0}
.seg button{min-height:40px;border-radius:9px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent-d);color:#fff}
.err{color:var(--danger);font-size:13.5px;margin-top:8px;min-height:1em}
#toast{position:fixed;bottom:calc(140px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#263238;color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;z-index:60;display:none;max-width:92%;align-items:center;gap:12px}
#toast.show{display:flex}
#toast button{color:#7fe0b0;font-weight:800;min-height:36px;padding:0 6px}
.banner{background:var(--soft);color:var(--text);padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.err2{background:#fde2e0;color:#7a1a16}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
.kv:last-child{border-bottom:0}
.legend .kv .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--border);text-align:start}
.chartbox{overflow-x:auto;direction:ltr}
.tag{font-size:11.5px;padding:1px 8px;border-radius:9px;background:var(--input);margin-inline-start:6px}
.hr{height:1px;background:var(--border);margin:10px 0}
</style>
</head>
<body>
<div id="banner"></div>
<header class="top"><div class="trow"><h1>مصاريفي</h1><span class="small" id="hsub"></span></div><div class="mnav" id="mnav"></div></header>
<main id="app"><div class="empty">جاري التحميل…</div></main>
<noscript><div class="empty">التطبيق محتاج JavaScript يكون شغال.</div></noscript>
<button id="fab" aria-label="إضافة عملية جديدة">+</button>
<nav id="nav" aria-label="التنقل الرئيسي"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var KEY='masarefy_v2',LEG_BK='masarefy_legacy_backup',AUTO_BK='masarefy_autobackup';
var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var PALETTE=['#128c7e','#e5873b','#5b6ee1','#c2477f','#2f9e44','#d6a100','#7b5ea7','#2b8cbe','#c0392b','#6c8a3b','#8d6e63','#546e7a'];
var DEBT_CAT='سداد ديون',COLLECT_CAT='تحصيل ديون';
var storageOK=true;

/* ---------- أدوات ---------- */
function pad(n){return n<10?'0'+n:''+n}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayKey(){return dkey(new Date())}
function curMonth(){return todayKey().slice(0,7)}
function addMonths(m,n){var p=m.split('-').map(Number),d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function addDays(k,n){var p=k.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]+n);return dkey(d)}
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;var p=s.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);return d.getFullYear()===p[0]&&d.getMonth()===p[1]-1&&d.getDate()===p[2]&&p[0]>=2000&&p[0]<=2100}
function dayLabel(s){var p=s.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);return DAYS[d.getDay()]+' '+p[2]+' '+MONTHS[p[1]-1]}
function monthLabel(m){var p=m.split('-').map(Number);return MONTHS[p[1]-1]+' '+p[0]}
function round2(n){return Math.round(n*100)/100}
var nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
function money(n){return nf.format(round2(n))+' ج.م'}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function str(v,max){return typeof v==='string'?v.replace(/[\u0000-\u001f\u007f]/g,' ').trim().slice(0,max||80):''}
function amt(v){var n=Number(v);return isFinite(n)&&n>0&&n<1e10?round2(n):0}
function parseAmount(s){
  s=String(s==null?'':s).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[٫,،]/g,'.').replace(/\s/g,'');
  if(!/^\d*\.?\d+$|^\d+\.?$/.test(s))return NaN;
  return parseFloat(s);
}
function h(tag,attrs){
  var e=document.createElement(tag),val;
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='value')val=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
  if(val!==undefined)e.value=val;
  return e;
}
function add(e,c){if(c==null||c===false)return;if(Array.isArray(c))c.forEach(function(x){add(e,x)});else e.appendChild(typeof c==='object'?c:document.createTextNode(String(c)))}
function $(s){return document.querySelector(s)}
var SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs){var e=document.createElementNS(SVGNS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);for(var i=2;i<arguments.length;i++)if(arguments[i])e.appendChild(arguments[i]);return e}

/* ---------- البيانات ---------- */
var DEFAULT_CATS=[
 ['أكل وشرب','🍽️',['فطار','غداء','عشاء','مطاعم','قهوة','سوبرماركت']],['مواصلات','🚌',['بنزين','مترو','أوبر','ميكروباص']],
 ['مشتريات','🛍️',['ملابس','أدوات','إلكترونيات']],['منزل','🏠',['إيجار','كهرباء','مياه','غاز','إنترنت']],
 ['صحة','💊',['دواء','كشف','تحاليل']],['اتصالات','📱',['رصيد','باقة إنترنت']],
 ['ترفيه','🎬',['سينما','خروجة','اشتراكات','ألعاب']],['تعليم','📚',['كتب','كورسات','مصاريف دراسة']],['أخرى','📦',[]]];
var ALIAS={'أكل وشرب':['أكل']};
var ICONS=['🍽️','🚌','🛍️','🏠','💊','📱','🎬','📚','📦','☕','⛽','🎁','💳','🧾','🐾','✈️','👶','💇','🏋️','🔧','💡','🎮','🏷️','💼'];
function iconFor(n){var m={'أكل':'🍽️','مواصلات':'🚌','سداد ديون':'💳','تحصيل ديون':'🤝'};return m[n]||'🏷️'}
function blank(){return{schema:2,expenses:[],income:[],budgets:{},catBudgets:{},cats:[],incomeSources:['مرتب','عمل حر','مكافأة','هدية','أخرى'],debts:[],recurring:[],
 settings:{theme:'auto',a75:true,a90:true,a100:true,newMonth:'leftover',notif:false,lastCat:'',lastSub:'',lastBackup:0,lastReminder:''},alertsShown:{}}}
function ensureDefaultCats(D){
  D.expenses.forEach(function(e){if(!D.cats.some(function(c){return c.name===e.cat}))D.cats.push({name:e.cat,icon:iconFor(e.cat),subs:[]})});
  DEFAULT_CATS.forEach(function(c){
    var names=[c[0]].concat(ALIAS[c[0]]||[]);
    if(!D.cats.some(function(x){return names.indexOf(x.name)!==-1}))D.cats.push({name:c[0],icon:c[1],subs:c[2].slice()});
  });
  D.expenses.forEach(function(e){if(e.sub){var c=D.cats.filter(function(x){return x.name===e.cat})[0];if(c&&c.subs.indexOf(e.sub)===-1)c.subs.push(e.sub)}});
}
function dedup(arr){var m={},o=[];arr.forEach(function(x){if(x&&!m[x.id]){m[x.id]=1;o.push(x)}});return o}
function cleanExp(x){if(!x||typeof x!=='object')return null;var a=amt(x.amount),c=str(x.cat,40);if(!a||!validDate(x.date)||!c)return null;
  return{id:str(x.id,60)||uid(),amount:a,cat:c,sub:str(x.sub,40),note:str(x.note,120),date:x.date,ts:Number(x.ts)||0}}
function cleanInc(x){if(!x||typeof x!=='object')return null;var a=amt(x.amount),c=str(x.source,40);if(!a||!validDate(x.date)||!c)return null;
  return{id:str(x.id,60)||uid(),amount:a,source:c,note:str(x.note,120),date:x.date,ts:Number(x.ts)||0}}
function cleanDebt(x){if(!x||typeof x!=='object')return null;var a=amt(x.amount),n=str(x.name,60);if(!a||!n)return null;
  var date=validDate(x.date)?x.date:todayKey(),sum=0,pays=[];
  (Array.isArray(x.payments)?x.payments:[]).forEach(function(p){if(!p||typeof p!=='object')return;var pa=amt(p.amount);if(!pa||!validDate(p.date))return;if(sum+pa>a+0.001)return;sum+=pa;
    pays.push({id:str(p.id,60)||uid(),date:p.date,amount:pa,note:str(p.note,120),legacy:!!p.legacy,ts:Number(p.ts)||0})});
  return{id:str(x.id,60)||uid(),name:n,kind:x.kind==='owed'?'owed':'owe',amount:a,date:date,due:validDate(x.due)?x.due:'',note:str(x.note,120),payments:dedup(pays)}}
function cleanRec(x){if(!x||typeof x!=='object')return null;var a=amt(x.amount),t=str(x.title,60),c=str(x.cat,40);if(!a||!t||!c||!validDate(x.start))return null;
  return{id:str(x.id,60)||uid(),title:t,amount:a,cat:c,sub:str(x.sub,40),freq:x.freq==='weekly'?'weekly':'monthly',start:x.start,end:validDate(x.end)?x.end:'',last:validDate(x.last)?x.last:''}}
function cleanCats(a){var seen={},o=[];(Array.isArray(a)?a:[]).forEach(function(c){if(!c||typeof c!=='object')return;var n=str(c.name,40);if(!n||seen[n])return;seen[n]=1;
  var subs=[],ss={};(Array.isArray(c.subs)?c.subs:[]).forEach(function(s){s=str(s,40);if(s&&!ss[s]){ss[s]=1;subs.push(s)}});
  o.push({name:n,icon:str(c.icon,8)||iconFor(n),subs:subs})});return o}
function cleanMap(m,monthKeys){var o={};if(m&&typeof m==='object')Object.keys(m).forEach(function(k){if(monthKeys&&!/^\d{4}-\d{2}$/.test(k))return;var v=amt(m[k]);if(v)o[k]=v});return o}
function cleanSettings(s,base){var o=Object.assign({},base);if(s&&typeof s==='object'){
  if(['auto','light','dark'].indexOf(s.theme)!==-1)o.theme=s.theme;['a75','a90','a100','notif'].forEach(function(k){if(typeof s[k]==='boolean')o[k]=s[k]});
  if(['leftover','same','zero'].indexOf(s.newMonth)!==-1)o.newMonth=s.newMonth;o.lastCat=str(s.lastCat,40);o.lastSub=str(s.lastSub,40);o.lastBackup=Number(s.lastBackup)||0;o.lastReminder=validDate(s.lastReminder)?s.lastReminder:''}return o}
function cleanData(raw){
  var D=blank();if(!raw||typeof raw!=='object')return D;
  D.expenses=dedup((Array.isArray(raw.expenses)?raw.expenses:[]).map(cleanExp));
  D.income=dedup((Array.isArray(raw.income)?raw.income:[]).map(cleanInc));
  D.debts=dedup((Array.isArray(raw.debts)?raw.debts:[]).map(cleanDebt));
  D.recurring=dedup((Array.isArray(raw.recurring)?raw.recurring:[]).map(cleanRec));
  D.budgets=cleanMap(raw.budgets,true);
  D.catBudgets=cleanMap(raw.catBudgets,false);
  D.cats=cleanCats(raw.cats);
  var src=[];(Array.isArray(raw.incomeSources)?raw.incomeSources:[]).forEach(function(s){s=str(s,40);if(s&&src.indexOf(s)===-1)src.push(s)});
  if(src.length)D.incomeSources=src;
  D.settings=cleanSettings(raw.settings,D.settings);
  if(raw.alertsShown&&typeof raw.alertsShown==='object')Object.keys(raw.alertsShown).forEach(function(k){if(raw.alertsShown[k]===1&&k.length<80)D.alertsShown[k]=1});
  ensureDefaultCats(D);
  return D;
}
/* ترحيل من النسخة القديمة (مفاتيح localStorage القديمة) */
function isLegacyKey(k){return /^expenses-\d{4}-\d{2}-\d{2}$/.test(k)||/^budget-\d{4}-\d{2}$/.test(k)||k==='expense-debts'||k.indexOf('expense-categories')===0}
function convertLegacy(dump){
  var o=blank();
  Object.keys(dump).forEach(function(k){
    var m=/^expenses-(\d{4}-\d{2}-\d{2})$/.exec(k);if(m){var arr;try{arr=JSON.parse(dump[k])}catch(e){return}if(!Array.isArray(arr))return;

function periodRange(p,month){
  var t=todayKey();
  if(p.period==='today')return{from:t,to:t};
  if(p.period==='week')return{from:addDays(t,-6),to:t};
  if(p.period==='month')return{from:month+'-01',to:month+'-31'};
  if(p.period==='last3')return{from:addMonths(month,-2)+'-01',to:month+'-31'};
  if(p.period==='year')return{from:month.slice(0,4)+'-01-01',to:month.slice(0,4)+'-12-31'};
  if(p.period==='range'||p.period==='custom'){if(validDate(p.from)&&validDate(p.to)&&p.from<=p.to)return{from:p.from,to:p.to};return{from:month+'-01',to:month+'-31'}}
  return{from:'0000',to:'9999'};
}
function filterLedger(p,month){
  var r=periodRange(p,month),q=(p.q||'').toLowerCase().trim();
  return ledger().filter(function(e){
    if(e.date<r.from||e.date>r.to)return false;
    if(p.cat&&e.cat!==p.cat)return false;
    if(q){var hay=[e.cat,e.sub,e.note,String(e.amount)].join(' ').toLowerCase();if(hay.indexOf(q)===-1)return false}
    return true;
  });
}

  if(supported&&Notification.permission!=='denied')nb.appendChild(h('button',{type:'button',class:'btn',style:'margin-top:8px',text:D.settings.notif&&Notification.permission==='granted'?'إيقاف التذكير':'فعّل التذكير',onclick:function(){
    if(D.settings.notif){D.settings.notif=false;save();render();return}
    Notification.requestPermission().then(function(p){D.settings.notif=p==='granted';save();render()})}}));
  main.appendChild(nb);
  var bk=h('div',{class:'card'},h('h2',{text:'النسخ الاحتياطي'}),
    h('div',{class:'muted small',text:D.settings.lastBackup?'آخر نسخة: '+new Date(D.settings.lastBackup).toLocaleString('ar-EG'):'لسه ماعملتش نسخة احتياطية.'}),
    h('div',{class:'muted small',style:'margin-top:6px',text:'النسخة فيها كل بياناتك: المصروفات والدخل والديون والسداد والميزانيات والتصنيفات والإعدادات.'}),
    h('button',{type:'button',class:'btn p',style:'margin-top:8px',text:'تصدير نسخة احتياطية',onclick:exportBackup}),
    h('button',{type:'button',class:'btn',style:'margin-top:8px',text:'استيراد نسخة احتياطية',onclick:function(){$('#impf').click()}}));
  main.appendChild(bk);
  main.appendChild(h('div',{class:'card'},h('h2',{text:'ℹ️ مهم عن بياناتك'}),
    h('div',{class:'muted small',text:'البيانات محفوظة على الجهاز ده بس (مش مشفرة ومش بتتزامن بين الأجهزة). مسح بيانات الموقع أو التخزين المحلي من المتصفح هيمسحها لو مفيش نسخة احتياطية — فاعمل نسخة بانتظام ولما تغيّر الفون استوردها.'})));
}
function openCatManager(){
  openSheet('إدارة التصنيفات',function(body){
    var box=h('div');body.appendChild(box);
    function renameEverywhere(o,n){D.expenses.forEach(function(e){if(e.cat===o)e.cat=n});D.recurring.forEach(function(r){if(r.cat===o)r.cat=n});if(D.catBudgets[o]!==undefined){D.catBudgets[n]=D.catBudgets[o];delete D.catBudgets[o]}if(D.settings.lastCat===o)D.settings.lastCat=n}
    function draw(){
      box.textContent='';
      D.cats.forEach(function(c,idx){
        var card=h('div',{class:'card',style:'padding:10px'});
        card.appendChild(h('div',{class:'trow'},h('b',{text:c.icon+' '+c.name}),h('span',{class:'small muted',text:D.catBudgets[c.name]?'ميزانية: '+money(D.catBudgets[c.name]):'بدون ميزانية'})));
        var r=h('div',{class:'chips',style:'margin-top:6px'});
        function b(t,l,fn,d){r.appendChild(h('button',{type:'button',class:'chip'+(d?' neg':''),text:t,'aria-label':l+' '+c.name,onclick:fn}))}
        b('▲','رفع',function(){if(idx>0){var t=D.cats[idx-1];D.cats[idx-1]=c;D.cats[idx]=t;save();draw()}});
        b('▼','خفض',function(){if(idx<D.cats.length-1){var t=D.cats[idx+1];D.cats[idx+1]=c;D.cats[idx]=t;save();draw()}});
        b('✎ اسم','تعديل اسم',function(){askText('اسم التصنيف','الاسم الجديد',c.name).then(function(n){if(!n||n===c.name)return;
          var ex=catObj(n);if(ex){ex.subs=ex.subs.concat(c.subs.filter(function(s){return ex.subs.indexOf(s)===-1}));D.cats.splice(D.cats.indexOf(c),1);if(D.catBudgets[c.name]&&!D.catBudgets[n])D.catBudgets[n]=D.catBudgets[c.name];delete D.catBudgets[c.name];D.expenses.forEach(function(e){if(e.cat===c.name)e.cat=n});D.recurring.forEach(function(x){if(x.cat===c.name)x.cat=n})}
          else{renameEverywhere(c.name,n);c.name=n}save();draw()})});
        b('🎨 أيقونة','تغيير أيقونة',function(){var ov=h('div',{class:'ov mid'}),bx=h('div',{class:'sheet'},h('div',{class:'hd'},h('b',{text:'اختار أيقونة'})));var g=h('div',{class:'catgrid',style:'grid-template-columns:repeat(4,1fr)'});
          ICONS.forEach(function(i){g.appendChild(h('button',{type:'button',class:'cat',text:i,'aria-label':i,onclick:function(){c.icon=i;save();ov.remove();draw()}}))});bx.appendChild(g);bx.appendChild(h('button',{type:'button',class:'btn',style:'margin-top:8px',text:'إلغاء',onclick:function(){ov.remove()}}));ov.appendChild(bx);document.body.appendChild(ov)});
        b('💰 ميزانية','ميزانية',function(){askText('ميزانية '+c.name,'المبلغ الشهري (اتركه فاضي لإلغائها)',D.catBudgets[c.name]||'').then(function(v){
          if(v===null){if(D.catBudgets[c.name]){delete D.catBudgets[c.name];save();draw()}return}var a=parseAmount(v);if(!(a>0)){toast('مبلغ غير صحيح');return}D.catBudgets[c.name]=round2(a);save();draw()})});
        b('＋ فرعي','إضافة تصنيف فرعي لـ',function(){askText('تصنيف فرعي جديد','الاسم').then(function(n){if(n&&c.subs.indexOf(n)===-1){c.subs.push(n);save();draw()}})});
        b('🗑','حذف',function(){modal('تحذف "'+c.name+'"؟ المصروفات القديمة هتفضل زي ما هي.',[{label:'احذف',v:1,d:true},{label:'لا',v:0}]).then(function(ok){if(!ok)return;D.cats.splice(D.cats.indexOf(c),1);delete D.catBudgets[c.name];save();draw()})},1);
        card.appendChild(r);
        if(c.subs.length){var sr=h('div',{class:'chips',style:'margin-top:8px'});c.subs.forEach(function(s){sr.appendChild(h('span',{class:'chip',style:'min-height:36px;padding:2px 4px 2px 10px'},h('span',{text:s}),
          h('button',{type:'button',text:'✎','aria-label':'تعديل '+s,style:'width:32px;height:32px',onclick:function(){askText('تعديل التصنيف الفرعي','الاسم الجديد',s).then(function(n){if(!n||n===s)return;var i=c.subs.indexOf(s);if(c.subs.indexOf(n)===-1)c.subs[i]=n;else c.subs.splice(i,1);D.expenses.forEach(function(e){if(e.cat===c.name&&e.sub===s)e.sub=n});D.recurring.forEach(function(x){if(x.cat===c.name&&x.sub===s)x.sub=n});save();draw()})}}),
          h('button',{type:'button',text:'✕','aria-label':'حذف '+s,style:'width:32px;height:32px;color:var(--danger)',onclick:function(){c.subs.splice(c.subs.indexOf(s),1);save();draw()}})))});card.appendChild(sr)}
        box.appendChild(card);
      });
      box.appendChild(h('button',{type:'button',class:'btn p',text:'+ تصنيف جديد',onclick:function(){askText('تصنيف جديد','الاسم').then(function(n){if(!n)return;if(catObj(n)){toast('التصنيف موجود');return}D.cats.push({name:n,icon:iconFor(n),subs:[]});save();draw()})}}));
    }
    draw();
  });
}
function openRecurring(r){
  openSheet(r?'تعديل مصروف متكرر':'مصروف متكرر',function(body,close){
    var tt=h('input',{type:'text',id:'rt1',maxlength:'60',value:r?r.title:'',placeholder:'مثال: إيجار الشقة'}),am=h('input',{type:'text',inputmode:'decimal',id:'rt2',value:r?String(r.amount):''}),
      cs=h('select',{id:'rt3'}),ss=h('select',{id:'rt4'}),fr=h('select',{id:'rt5'},h('option',{value:'monthly',text:'شهري'}),h('option',{value:'weekly',text:'أسبوعي'})),
      st=h('input',{type:'date',id:'rt6',value:r?r.start:todayKey()}),en=h('input',{type:'date',id:'rt7',value:r?r.end:''}),err=h('div',{class:'err',role:'alert'});
    D.cats.forEach(function(c){cs.appendChild(h('option',{value:c.name,text:c.name}))});
    if(r&&!catObj(r.cat))cs.appendChild(h('option',{value:r.cat,text:r.cat}));if(r)cs.value=r.cat;
    function subs(){ss.textContent='';ss.appendChild(h('option',{value:'',text:'بدون'}));var c=catObj(cs.value);if(c)c.subs.forEach(function(s){ss.appendChild(h('option',{value:s,text:s}))});if(r&&r.cat===cs.value&&r.sub)ss.value=r.sub}
    cs.onchange=subs;subs();if(r)fr.value=r.freq;
    [['الاسم','rt1',tt],['المبلغ','rt2',am],['التصنيف','rt3',cs],['التصنيف الفرعي','rt4',ss],['التكرار','rt5',fr],['تاريخ البداية','rt6',st],['تاريخ النهاية (اختياري)','rt7',en]].forEach(function(x){body.appendChild(h('label',{class:'fl',for:x[1],text:x[0]}));body.appendChild(x[2])});
    body.appendChild(h('div',{class:'muted small',style:'margin-top:8px',text:'هتظهرلك كتذكير للتأكيد في الرئيسية — مش هتتسجل تلقائيًا.'}));body.appendChild(err);
    body.appendChild(h('button',{type:'button',class:'btn p',style:'margin-top:10px',text:'حفظ',onclick:function(){
      var t=str(tt.value,60),a=parseAmount(am.value);
      if(!t){err.textContent='اكتب اسم المصروف';return}if(!(a>0)){err.textContent='اكتب مبلغ صحيح';return}
      if(!validDate(st.value)){err.textContent='تاريخ البداية غير صحيح';return}if(en.value&&(!validDate(en.value)||en.value<st.value)){err.textContent='تاريخ النهاية لازم يكون بعد البداية';return}
      var o={id:r?r.id:uid(),title:t,amount:round2(a),cat:cs.value,sub:ss.value,freq:fr.value,start:st.value,end:en.value,last:r?r.last:''};
      if(r)Object.assign(r,o);else D.recurring.push(o);save();close();toast('اتحفظ ✓')}}));
  });
}

/* ---------- النسخ الاحتياطي ---------- */
function exportObj(){return{app:'masarefy',schema:2,exportedAt:Date.now(),data:{expenses:D.expenses,income:D.income,debts:D.debts,budgets:D.budgets,catBudgets:D.catBudgets,cats:D.cats,incomeSources:D.incomeSources,recurring:D.recurring,settings:D.settings}}}
function exportBackup(){download(JSON.stringify(exportObj(),null,1),'masarefy-backup-'+todayKey()+'.json','application/json');D.settings.lastBackup=Date.now();save();toast('✅ اتجهزت النسخة الاحتياطية');render()}
function parseBackup(text){
  var j;try{j=JSON.parse(text)}catch(e){return{err:'الملف مش بصيغة JSON سليمة'}}
  if(!j||typeof j!=='object'||Array.isArray(j))return{err:'محتوى الملف مش نسخة احتياطية من مصاريفي'};
  if(j.app==='masarefy'){
    if(typeof j.schema!=='number'||j.schema>2)return{err:'النسخة دي من إصدار أحدث من التطبيق ومش مدعومة'};
    return{data:cleanData(j.data),kind:'جديد'};
  }
  var keys=Object.keys(j);
  if(keys.some(isLegacyKey)&&keys.every(function(k){return typeof j[k]==='string'}))return{data:convertLegacy(j),kind:'قديم (النسخة السابقة من التطبيق)'};
  return{err:'الملف ده مش نسخة احتياطية من مصاريفي'};
}
function mergeData(inc){
  var res={e:0,i:0,d:0,p:0,r:0},ids=function(a){var m={};a.forEach(function(x){m[x.id]=x});return m};
  var em=ids(D.expenses);inc.expenses.forEach(function(x){if(!em[x.id]){D.expenses.push(x);res.e++}});
  var im=ids(D.income);inc.income.forEach(function(x){if(!im[x.id]){D.income.push(x);res.i++}});
  var dm=ids(D.debts);inc.debts.forEach(function(x){var o=dm[x.id];if(!o){D.debts.push(x);res.d++;return}
    var pm=ids(o.payments);x.payments.forEach(function(p){if(!pm[p.id]&&round2(paidOf(o)+p.amount)<=o.amount){o.payments.push(p);res.p++}})});
  var rm=ids(D.recurring);inc.recurring.forEach(function(x){if(!rm[x.id]){D.recurring.push(x);res.r++}});
  Object.keys(inc.budgets).forEach(function(k){if(D.budgets[k]===undefined)D.budgets[k]=inc.budgets[k]});
  Object.keys(inc.catBudgets).forEach(function(k){if(D.catBudgets[k]===undefined)D.catBudgets[k]=inc.catBudgets[k]});
  inc.cats.forEach(function(c){var o=catObj(c.name);if(!o)D.cats.push(c);else c.subs.forEach(function(s){if(o.subs.indexOf(s)===-1)o.subs.push(s)})});
  inc.incomeSources.forEach(function(s){if(D.incomeSources.indexOf(s)===-1)D.incomeSources.push(s)});
  ensureDefaultCats(D);return res;
}
function countNew(inc){var c=function(a,b){var m={};b.forEach(function(x){m[x.id]=1});return a.filter(function(x){return !m[x.id]}).length};
  return{e:c(inc.expenses,D.expenses),i:c(inc.income,D.income),d:c(inc.debts,D.debts)}}
async function importFile(file){
  var text;try{text=await file.text()}catch(e){toast('معرفتش أقرا الملف');return}
  var r=parseBackup(text);if(r.err){modal('⚠️ '+r.err,[{label:'تمام',v:1,p:true}]);return}
  var inc=r.data,n=countNew(inc);
  var msg='نسخة '+r.kind+':\n• '+inc.expenses.length+' مصروف ('+n.e+' جديد)\n• '+inc.income.length+' دخل ('+n.i+' جديد)\n• '+inc.debts.length+' دين ('+n.d+' جديد)\n• '+Object.keys(inc.budgets).length+' ميزانية شهرية\n\nالدمج بيضيف الجديد بس ومبيكررش اللي موجود. الاستبدال بيحل محل بياناتك الحالية (وبيتعمل نسخة تلقائية قبلها).';
  var ch=await modal(msg,[{label:'دمج مع الموجود (الأكثر أمانًا)',v:'merge',p:true},{label:'استبدال كل البيانات',v:'replace',d:true},{label:'إلغاء',v:null}]);
  if(!ch)return;
  if(ch==='replace'){
    var ok=await modal('هتستبدل كل بياناتك الحالية بالنسخة دي. متأكد؟',[{label:'أيوه، استبدل',v:true,d:true},{label:'لا',v:false}]);if(!ok)return;
    try{localStorage.setItem(AUTO_BK,JSON.stringify(exportObj()))}catch(e){}
    D=inc;ensureDefaultCats(D);
  }else mergeData(inc);
  save();applyTheme();render();toast('✅ تم الاستيراد');
}

/* ---------- تشغيل ---------- */
var lastDay=null;
function render(){
  var main=$('#app');
  // حفظ الـ scroll للصفحة
  var y=window.scrollY;main.textContent='';
  renderHeader();renderNav();
  try{
    if(S.tab==='home')renderHome(main);else if(S.tab==='log')renderLog(main);else if(S.tab==='reports')renderReports(main);else if(S.tab==='debts')renderDebts(main);else renderSettings(main);
  }catch(e){main.appendChild(h('div',{class:'card'},emptyState('⚠️','حصلت مشكلة في عرض الصفحة. بياناتك سليمة ومحفوظة.')));if(window.console)console.error('render error')}
  window.scrollTo(0,y);
}
function checkReminder(){
  try{if(!D.settings.notif||!('Notification' in window)||Notification.permission!=='granted')return;var t=todayKey();if(D.settings.lastReminder===t)return;
    if(!D.expenses.some(function(e){return e.date===t})){new Notification('مصاريفي',{body:'لسه ما سجلتش أي مصروف النهاردة 👀'});D.settings.lastReminder=t;save()}}catch(e){}
}
function dayTick(){var t=todayKey();if(lastDay&&t!==lastDay){var wasCur=S.month===lastDay.slice(0,7);if(wasCur)S.month=t.slice(0,7);ensureBudget();render()}lastDay=t}
function init(){
  D=load();applyTheme();ensureBudget();lastDay=todayKey();
  var f=h('input',{type:'file',id:'impf',accept:'application/json,.json',style:'display:none'});f.addEventListener('change',function(){if(f.files[0])importFile(f.files[0]);f.value=''});document.body.appendChild(f);
  $('#fab').onclick=function(){openEntry({})};
  document.addEventListener('visibilitychange',function(){if(!document.hidden)dayTick()});setInterval(dayTick,30000);
  if(!storageOK)$('#banner').appendChild(h('div',{class:'banner err2',text:'المتصفح مانع التخزين المحلي (وضع خصوصية؟) — البيانات مش هتتحفظ.'}));
  render();checkReminder();
}
init();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
