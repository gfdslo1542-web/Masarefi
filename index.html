<style>
:root{--bg:#ece5dd;--card:#fff;--text:#111b21;--muted:#5b6b73;--border:#e2e7e9;--accent:#25d366;--accent-d:#0f7a6c;--header:#075e54;--danger:#c9302c;--warn:#b37400;--ok:#14803f;--input:#f4f4f1;--soft:#e3f5d3;--btn-text:#fff;--shadow:rgba(0,0,0,.25)}
[data-theme=dark]{--bg:#0b141a;--card:#16222a;--text:#e7eef1;--muted:#9fb0b8;--border:#26363f;--accent:#2fd47a;--accent-d:#1d9e8c;--header:#12302c;--danger:#ff7a73;--warn:#f0b429;--ok:#4cd98a;--input:#1d2c35;--soft:#1c3a2d;--btn-text:#04170f;--shadow:rgba(0,0,0,.6)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;padding-bottom:calc(150px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;width:100%;min-height:46px;border:1px solid var(--border);border-radius:12px;padding:8px 12px;background:var(--input);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent-d);outline-offset:1px}
label.fl{display:block;font-size:13px;color:var(--muted);margin:12px 2px 5px}
header.top{background:var(--header);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:20}
header.top h1{margin:0;font-size:19px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.langbtn{color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:14px;min-width:48px;height:36px;font-weight:700;font-size:13px;padding:0 12px}
.mnav{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.mnav button{color:#fff;font-size:20px;width:44px;height:40px;border-radius:10px}
.mnav .cur{flex:1;max-width:220px;height:40px;background:rgba(255,255,255,.14);border-radius:10px;font-weight:700;font-size:15px}
#app{max-width:640px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2,.card h3{margin:0 0 8px;font-size:15px}
.muted{color:var(--muted)}.small{font-size:13px}
.big{font-size:30px;font-weight:800}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.box{background:var(--input);border-radius:12px;padding:10px 6px;text-align:center}
.box .l{font-size:12px;color:var(--muted)}.box .v{font-size:16px;font-weight:700;word-break:break-word}
.pos{color:var(--ok)}.neg{color:var(--danger)}.warnc{color:var(--warn)}
.btn{display:block;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--border);background:var(--input);font-weight:700;text-align:center;padding:8px 12px}
.btn.p{background:var(--accent-d);color:#fff;border-color:var(--accent-d)}
.btn.d{color:var(--danger)}
.btn.sm{min-height:40px;width:auto;display:inline-block;font-size:14px;padding:6px 14px}
.btn[disabled]{opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bar{height:12px;background:var(--input);border-radius:8px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--accent-d);border-radius:8px}
.bar.warn i{background:var(--warn)}.bar.danger i{background:var(--danger)}
.status{font-size:14px;font-weight:700;margin-top:4px}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.danger{color:var(--danger)}
.entry{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.entry:last-child{border-bottom:0}
.entry .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--input);flex:none}
.entry .mid{flex:1;min-width:0}
.entry .t{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.entry .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.entry .a{font-weight:700;font-size:14.5px;white-space:nowrap}
.entry .ab{width:40px;height:40px;border-radius:10px;font-size:16px;color:var(--muted);flex:none}
.entry .ab.x{color:var(--danger)}
details.day{border-bottom:1px solid var(--border)}
details.day:last-child{border-bottom:0}
details.day>summary{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:46px;cursor:pointer;font-weight:600;list-style:none}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary::before{content:"▾";color:var(--muted);width:16px;flex:none;text-align:center}
details.day[open]>summary::before{content:"▴"}
details.day>summary>span:first-of-type{flex:1}
.kv.leaf{font-size:16px}
.kv.leaf::before{content:"";width:16px;flex:none}
.kv.leaf>span:first-of-type{flex:1}
.empty{text-align:center;color:var(--muted);padding:18px 6px;font-size:14px}
.empty .e{font-size:34px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:42px;padding:6px 14px;border-radius:21px;border:1px solid var(--border);background:var(--input);font-size:14px}
.chip[aria-pressed=true],.chip.on{background:var(--accent-d);color:#fff;border-color:var(--accent-d)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{min-height:66px;border-radius:14px;border:2px solid var(--border);background:var(--input);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;padding:4px;overflow-wrap:anywhere}
.cat .ci{font-size:22px}
.cat[aria-pressed=true]{border-color:var(--accent-d);background:var(--soft);font-weight:700}
.cat .tg{font-size:10.5px;color:var(--muted)}
nav#nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:25}
nav#nav button{flex:1;padding:7px 2px 6px;font-size:11.5px;color:var(--muted);text-align:center;min-height:56px}
nav#nav button .i{display:block;font-size:20px;line-height:1.2}
nav#nav button[aria-current=page]{color:var(--accent-d);font-weight:800}
#fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));inset-inline-end:16px;width:60px;height:60px;border-radius:30px;background:var(--accent-d);color:#fff;font-size:32px;line-height:1;box-shadow:0 4px 14px var(--shadow);z-index:26}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.ov.mid{align-items:center;padding:20px}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom))}
.ov.mid .sheet{border-radius:16px;max-width:360px;max-height:85vh}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheet .hd b{font-size:17px}
.sheet .hd button{font-size:22px;width:44px;height:44px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--input);border-radius:12px;padding:4px;margin:8px 0}
.seg button{min-height:40px;border-radius:9px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--accent-d);color:#fff}
.err{color:var(--danger);font-size:13.5px;margin-top:8px;min-height:1em}
#toast{position:fixed;bottom:calc(140px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#263238;color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;z-index:60;display:none;max-width:92%;align-items:center;gap:12px}
#toast.show{display:flex}
#toast button{color:#7fe0b0;font-weight:800;min-height:36px;padding:0 6px}
.banner{background:var(--soft);color:var(--text);padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.err2{background:#fde2e0;color:#7a1a16}
.kv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
.kv:last-child{border-bottom:0}
.legend .kv .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 4px;border-bottom:1px solid var(--border);text-align:start}
.chartbox{overflow-x:auto;direction:ltr}
.tag{font-size:11.5px;padding:1px 8px;border-radius:9px;background:var(--input);margin-inline-start:6px}
.hr{height:1px;background:var(--border);margin:10px 0}
</style>
</head>

function pad(n){return n<10?'0'+n:''+n}

function periodRange(p,month){
  var t=todayKey();
  if(p.period==='today')return{from:t,to:t};
  if(p.period==='week')return{from:addDays(t,-6),to:t};
  if(p.period==='month')return{from:month+'-01',to:month+'-31'};
  if(p.period==='last3')return{from:addMonths(month,-2)+'-01',to:month+'-31'};
  if(p.period==='year')return{from:month.slice(0,4)+'-01-01',to:month.slice(0,4)+'-12-31'};
  if(p.period==='range'||p.period==='custom'){if(validDate(p.from)&&validDate(p.to)&&p.from<=p.to)return{from:p.from,to:p.to};return{from:month+'-01',to:month+'-31'}}
  return{from:'0000',to:'9999'};
}
function filterLedger(p,month){
  var r=periodRange(p,month),q=(p.q||'').toLowerCase().trim();
  return ledger().filter(function(e){
    if(e.date<r.from||e.date>r.to)return false;
    if(p.cat&&e.cat!==p.cat)return false;
    if(q){var hay=[e.cat,e.sub,e.note,String(e.amount)].join(' ').toLowerCase();if(hay.indexOf(q)===-1)return false}
    return true;
  });
}

        card.appendChild(r);
        if(c.subs.length){var sr=h('div',{class:'chips',style:'margin-top:8px'});c.subs.forEach(function(s){sr.appendChild(h('span',{class:'chip',style:'min-height:36px;padding-block:2px;padding-inline:10px 4px'},h('span',{text:cn(s)}),
          h('button',{type:'button',text:'✎','aria-label':T('تعديل ')+cn(s),style:'width:32px;height:32px',onclick:function(){openNameEditor(s,draw)}}),
          h('button',{type:'button',text:'✕','aria-label':T('حذف ')+cn(s),style:'width:32px;height:32px;color:var(--danger)',onclick:function(){c.subs.splice(c.subs.indexOf(s),1);save();draw()}})))});card.appendChild(sr)}
        box.appendChild(card);
      });
      box.appendChild(h('button',{type:'button',class:'btn p',text:T('+ تصنيف جديد'),onclick:function(){askText(T('تصنيف جديد'),T('الاسم')).then(function(n){if(!n)return;if(catObj(n)){toast(T('التصنيف موجود'));return}pickIcon('',function(g){addCatObj(n,g);save();draw()})})}}));
    }
    draw();
  });
}
function openRecurring(r){
  openSheet(r?T('تعديل مصروف متكرر'):T('مصروف متكرر'),function(body,close){
    var tt=h('input',{type:'text',id:'rt1',maxlength:'60',value:r?r.title:'',placeholder:T('مثال: إيجار الشقة')}),am=h('input',{type:'text',inputmode:'decimal',id:'rt2',value:r?String(r.amount):''}),
      cs=h('select',{id:'rt3'}),ss=h('select',{id:'rt4'}),fr=h('select',{id:'rt5'},h('option',{value:'monthly',text:T('شهري')}),h('option',{value:'weekly',text:T('أسبوعي')})),
      st=h('input',{type:'date',id:'rt6',value:r?r.start:todayKey()}),en=h('input',{type:'date',id:'rt7',value:r?r.end:''}),err=h('div',{class:'err',role:'alert'});
    D.cats.forEach(function(c){cs.appendChild(h('option',{value:c.name,text:cn(c.name)}))});
    if(r&&!catObj(r.cat))cs.appendChild(h('option',{value:r.cat,text:r.cat}));if(r)cs.value=r.cat;
    function subs(){ss.textContent='';ss.appendChild(h('option',{value:'',text:T('بدون')}));var c=catObj(cs.value);if(c)c.subs.forEach(function(s){ss.appendChild(h('option',{value:s,text:cn(s)}))});if(r&&r.cat===cs.value&&r.sub)ss.value=r.sub}
    cs.onchange=subs;subs();if(r)fr.value=r.freq;
    [[T('الاسم'),'rt1',tt],[T('المبلغ'),'rt2',am],[T('التصنيف'),'rt3',cs],[T('التصنيف الفرعي'),'rt4',ss],[T('التكرار'),'rt5',fr],[T('تاريخ البداية'),'rt6',st],[T('تاريخ النهاية (اختياري)'),'rt7',en]].forEach(function(x){body.appendChild(h('label',{class:'fl',for:x[1],text:x[0]}));body.appendChild(x[2])});
    body.appendChild(h('div',{class:'muted small',style:'margin-top:8px',text:T('هتظهرلك كتذكير للتأكيد في الرئيسية — مش هتتسجل تلقائيًا.')}));body.appendChild(err);
    body.appendChild(h('button',{type:'button',class:'btn p',style:'margin-top:10px',text:T('حفظ'),onclick:function(){
      var t=str(tt.value,60),a=parseAmount(am.value);
      if(!t){err.textContent=T('اكتب اسم المصروف');return}if(!(a>0)){err.textContent=T('اكتب مبلغ صحيح');return}
      if(!validDate(st.value)){err.textContent=T('تاريخ البداية غير صحيح');return}if(en.value&&(!validDate(en.value)||en.value<st.value)){err.textContent=T('تاريخ النهاية لازم يكون بعد البداية');return}
      var o={id:r?r.id:uid(),title:t,amount:round2(a),cat:cs.value,sub:ss.value,freq:fr.value,start:st.value,end:en.value,last:r?r.last:''};
      if(r)Object.assign(r,o);else D.recurring.push(o);save();close();toast(T('اتحفظ ✓'))}}));
  });
}

/* ---------- النسخ الاحتياطي ---------- */
function exportObj(){return{app:'masarefy',schema:2,exportedAt:Date.now(),data:{expenses:D.expenses,income:D.income,debts:D.debts,budgets:D.budgets,budgetFixed:D.budgetFixed,catBudgets:D.catBudgets,cats:D.cats,tr:D.tr,deletedCats:D.deletedCats,incomeSources:D.incomeSources,recurring:D.recurring,settings:D.settings}}}
function exportBackup(){download(JSON.stringify(exportObj(),null,1),'masarefy-backup-'+todayKey()+'.json','application/json');D.settings.lastBackup=Date.now();save();toast(T('✅ اتجهزت النسخة الاحتياطية'));render()}
function parseBackup(text){
  var j;try{j=JSON.parse(text)}catch(e){return{err:T('الملف مش بصيغة JSON سليمة')}}
  if(!j||typeof j!=='object'||Array.isArray(j))return{err:T('محتوى الملف مش نسخة احتياطية من مصاريفي')};
  if(j.app==='masarefy'){
    if(typeof j.schema!=='number'||j.schema>2)return{err:T('النسخة دي من إصدار أحدث من التطبيق ومش مدعومة')};
    return{data:cleanData(j.data),kind:T('جديد')};
  }
  var keys=Object.keys(j);
  if(keys.some(isLegacyKey)&&keys.every(function(k){return typeof j[k]==='string'}))return{data:convertLegacy(j),kind:T('قديم (النسخة السابقة من التطبيق)')};
  return{err:T('الملف ده مش نسخة احتياطية من مصاريفي')};
}
function mergeData(inc){
  var res={e:0,i:0,d:0,p:0,r:0},ids=function(a){var m={};a.forEach(function(x){m[x.id]=x});return m};
  var em=ids(D.expenses);inc.expenses.forEach(function(x){if(!em[x.id]){D.expenses.push(x);res.e++}});
  var im=ids(D.income);inc.income.forEach(function(x){if(!im[x.id]){D.income.push(x);res.i++}});
  var dm=ids(D.debts);inc.debts.forEach(function(x){var o=dm[x.id];if(!o){D.debts.push(x);res.d++;return}
    var pm=ids(o.payments);x.payments.forEach(function(p){if(!pm[p.id]&&round2(paidOf(o)+p.amount)<=o.amount){o.payments.push(p);res.p++}})});
  var rm=ids(D.recurring);inc.recurring.forEach(function(x){if(!rm[x.id]){D.recurring.push(x);res.r++}});
  Object.keys(inc.budgets).forEach(function(k){if(D.budgets[k]===undefined){D.budgets[k]=inc.budgets[k];if(inc.budgetFixed[k])D.budgetFixed[k]=1}});
  Object.keys(inc.catBudgets).forEach(function(k){if(D.catBudgets[k]===undefined)D.catBudgets[k]=inc.catBudgets[k]});
  Object.keys(inc.tr).forEach(function(k){if(!D.tr[k])D.tr[k]=inc.tr[k]});
  inc.cats.forEach(function(c){var o=catObj(c.name);if(!o){D.cats.push(c);D.deletedCats=D.deletedCats.filter(function(n){return n!==c.name})}else c.subs.forEach(function(s){if(o.subs.indexOf(s)===-1)o.subs.push(s)})});
  inc.incomeSources.forEach(function(s){if(D.incomeSources.indexOf(s)===-1)D.incomeSources.push(s)});
  ensureDefaultCats(D);return res;
}
function countNew(inc){var c=function(a,b){var m={};b.forEach(function(x){m[x.id]=1});return a.filter(function(x){return !m[x.id]}).length};
  return{e:c(inc.expenses,D.expenses),i:c(inc.income,D.income),d:c(inc.debts,D.debts)}}
async function importFile(file){
  var text;try{text=await file.text()}catch(e){toast(T('معرفتش أقرا الملف'));return}
  var r=parseBackup(text);if(r.err){modal('⚠️ '+r.err,[{label:T('تمام'),v:1,p:true}]);return}
  var inc=r.data,n=countNew(inc);
  var msg=T('نسخة ')+r.kind+':\n• '+inc.expenses.length+T(' مصروف (')+n.e+T(' جديد)\n• ')+inc.income.length+T(' دخل (')+n.i+T(' جديد)\n• ')+inc.debts.length+T(' دين (')+n.d+T(' جديد)\n• ')+Object.keys(inc.budgets).length+T(' ميزانية شهرية\n\nالدمج بيضيف الجديد بس ومبيكررش اللي موجود. الاستبدال بيحل محل بياناتك الحالية (وبيتعمل نسخة تلقائية قبلها).');
  var ch=await modal(msg,[{label:T('دمج مع الموجود (الأكثر أمانًا)'),v:'merge',p:true},{label:T('استبدال كل البيانات'),v:'replace',d:true},{label:T('إلغاء'),v:null}]);
  if(!ch)return;
  if(ch==='replace'){
    var ok=await modal(T('هتستبدل كل بياناتك الحالية بالنسخة دي. متأكد؟'),[{label:T('أيوه، استبدل'),v:true,d:true},{label:T('لا'),v:false}]);if(!ok)return;
    try{localStorage.setItem(AUTO_BK,JSON.stringify(exportObj()))}catch(e){}
    D=inc;ensureDefaultCats(D);
  }else mergeData(inc);
  save();applyTheme();render();toast(T('✅ تم الاستيراد'));
}

/* ---------- تشغيل ---------- */
var lastDay=null;
function applyStatic(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';
  document.title=T('مصاريفي');$('header.top h1').textContent=T('مصاريفي');
  var lb=$('#langbtn');lb.textContent=lang==='en'?'عربي':'EN';
  $('#fab').setAttribute('aria-label',T('عملية جديدة'));$('#nav').setAttribute('aria-label',T('الرئيسية'));
}
function setLang(l){
  lang=l==='en'?'en':'ar';try{localStorage.setItem(LK,lang)}catch(e){}
  while(sheets.length){var o=sheets.pop();if(o&&o.parentNode)o.parentNode.removeChild(o)}
  document.querySelectorAll('.ov.mid').forEach(function(x){x.remove()});
  applyStatic();render();
}
function render(){
  var main=$('#app');
  // حفظ الـ scroll للصفحة
  var y=window.scrollY;main.textContent='';
  renderHeader();renderNav();
  try{
    if(S.tab==='home')renderHome(main);else if(S.tab==='log')renderLog(main);else if(S.tab==='reports')renderReports(main);else if(S.tab==='debts')renderDebts(main);else renderSettings(main);
  }catch(e){main.appendChild(h('div',{class:'card'},emptyState('⚠️',T('حصلت مشكلة في عرض الصفحة. بياناتك سليمة ومحفوظة.'))));if(window.console)console.error('render error')}
  window.scrollTo(0,y);
}
function checkReminder(){
  try{if(!D.settings.notif||!('Notification' in window)||Notification.permission!=='granted')return;var t=todayKey();if(D.settings.lastReminder===t)return;
    if(!D.expenses.some(function(e){return e.date===t})){new Notification(T('مصاريفي'),{body:T('لسه ما سجلتش أي مصروف النهاردة 👀')});D.settings.lastReminder=t;save()}}catch(e){}
}
function dayTick(){var t=todayKey();if(lastDay&&t!==lastDay){var wasCur=S.month===lastDay.slice(0,7);if(wasCur)S.month=t.slice(0,7);render()}lastDay=t}
function init(){
  D=load();applyTheme();lastDay=todayKey();
  var f=h('input',{type:'file',id:'impf',accept:'application/json,.json',style:'display:none'});f.addEventListener('change',function(){if(f.files[0])importFile(f.files[0]);f.value=''});document.body.appendChild(f);
  $('#fab').onclick=function(){openEntry({})};$('#langbtn').onclick=function(){setLang(lang==='en'?'ar':'en')};applyStatic();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)dayTick()});setInterval(dayTick,30000);
  if(!storageOK)$('#banner').appendChild(h('div',{class:'banner err2',text:T('المتصفح مانع التخزين المحلي (وضع خصوصية؟) — البيانات مش هتتحفظ.')}));
  render();checkReminder();
  if(!D.settings.budgetAsked){
    D.settings.budgetAsked=true;var cm=curMonth(),old=D.budgets[cm];save();
    if(old>0&&!D.budgetFixed[cm])modal(T('الميزانية اللي كنت محددها لشهر ')+monthLabel(cm)+' ('+money(old)+') '+T('هتتحسب كإضافة يدوية فوق (الدخل + المدّخر من الشهر اللي فات). تعتبرها كده، ولا تصفّرها وتبدأ من الدخل والمدّخر بس؟'),[{label:T('خليها إضافة يدوية'),v:1,p:true},{label:T('صفّرها'),v:0}]).then(function(v){if(!v){delete D.budgets[cm];save()}render()});
  }else save();
}
init();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
